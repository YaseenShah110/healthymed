line-length = 120
target-version = "py312"

[lint]
select = ["E", "F", "W", "I"]

[lint.per-file-ignores]
# "env" is injected as a global by `odoo-bin shell`, not a real import.
"scripts/bootstrap/*.py" = ["F821"]
"scripts/checks/*.py" = ["F821"]
# Odoo's own convention: __init__.py files only re-export submodules for
# module registration; the imports are never otherwise referenced.
"**/__init__.py" = ["F401", "I001"]
